[package]
name = "score-studio"
version = "0.1.0"
description = "Score Studio — interactive piano scores with playback, MIDI and analysis"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[lib]
name = "score_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustysynth = "1.3"
cpal = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
log = "0.4"
midir = "0.10"

[profile.release]
lto = true
codegen-units = 1
